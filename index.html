<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDTrSNBfTMFEPZkrz3vYS-ZqFu79AGAkSo",
    authDomain: "portfoli-1d58d.firebaseapp.com",
    projectId: "portfoli-1d58d",
    storageBucket: "portfoli-1d58d.firebasestorage.app",
    messagingSenderId: "671425199562",
    appId: "1:671425199562:web:ed374a1e85d24473ec6333"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Reference to your PROJECT collection
  const projectsRef = collection(db, "PROJECT");

  // Add a new document
  async function addProject(data) {
    try {
      const docRef = await addDoc(projectsRef, data);
      console.log("Project added with ID:", docRef.id);
    } catch (e) {
      console.error("Error adding project:", e);
    }
  }

  // Read all documents
  async function loadProjects() {
    const querySnapshot = await getDocs(projectsRef);
    querySnapshot.forEach((doc) => {
      console.log(doc.id, "=>", doc.data());
    });
  }

  // Connect the form to addProject()
  document.getElementById("projectForm").addEventListener("submit", async (e) => {
    e.preventDefault(); // stop page reload

    const title = document.getElementById("title").value;
    const description = document.getElementById("description").value;
    const link = document.getElementById("link").value;

    await addProject({
      title: title,
      description: description,
      link: link,
      createdAt: new Date()
    });

    document.getElementById("projectForm").reset(); // clear the form
    alert("Project added!");
    loadProjects(); // refresh console log, optional
  });

  // Load existing projects when the page loads
  loadProjects();
</script>
